name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Keep a copy as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpeedMeter-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as a release (easy phone download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SpeedMeter.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest SpeedMeter.apk \
            --title "Speed Meter (latest)" \
            --notes "Download SpeedMeter.apk on your Android phone and install it." \
            --target "${{ github.sha }}"
